<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Thông tin sản phẩm')}"></head><body class="admin-page"><div th:replace="~{fragments/common :: header}"></div><main id="main" class="container admin-layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><div class="admin-content"><div class="page-heading"><div><span class="eyebrow">QUẢN LÝ HÀNG HÓA</span><h1 th:text="${form.id==null}?'Thêm sản phẩm':'Chỉnh sửa sản phẩm'"></h1></div><a th:href="@{/admin/products}" class="text-link">← Danh sách</a></div><form class="panel admin-form" th:action="@{/admin/products/save}" method="post" th:object="${form}"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{version}"><div class="alert danger" th:if="${#fields.hasAnyErrors()}" role="alert"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-grid"><div class="span-two"><label for="name">Tên sản phẩm</label><input id="name" th:field="*{name}" maxlength="160" required></div><div><label for="categoryId">Danh mục</label><select id="categoryId" th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div><div><label for="brand">Thương hiệu</label><input id="brand" th:field="*{brand}" maxlength="80"></div><div><label for="price">Giá bán (₫)</label><input id="price" th:field="*{price}" type="number" min="1000" max="999999999" step="1" required></div><div><label for="originalPrice">Giá gốc trước giảm (₫)</label><input id="originalPrice" th:field="*{originalPrice}" type="number" min="0" max="999999999" step="1" required><p class="hint">Đặt 0 nếu không áp dụng giảm giá.</p></div><div><label for="stock">Số lượng tồn kho</label><input id="stock" th:field="*{stock}" type="number" min="0" max="1000000" required></div><div><label for="imageUrl">Đường dẫn ảnh sản phẩm</label><input id="imageUrl" th:field="*{imageUrl}" maxlength="500" placeholder="https://... hoặc /images/..." required></div><div class="span-two"><label for="sourceUrl">Trang sản phẩm tại nguồn tham khảo</label><input id="sourceUrl" th:field="*{sourceUrl}" type="url" maxlength="500" placeholder="https://gearvn.com/products/..."></div><div><label for="sourceRetailer">Tên nhà bán lẻ</label><input id="sourceRetailer" th:field="*{sourceRetailer}" maxlength="100" placeholder="GEARVN, CellphoneS..."></div><div><label for="priceCheckedAt">Ngày kiểm tra giá tại nguồn</label><input id="priceCheckedAt" th:field="*{priceCheckedAt}" type="date"></div><div class="span-two"><label for="description">Mô tả sản phẩm</label><textarea id="description" th:field="*{description}" maxlength="3000" rows="5" required></textarea></div><div><label class="check"><input th:field="*{active}" type="checkbox"> Hiển thị trong cửa hàng</label></div><div><label class="check"><input th:field="*{featured}" type="checkbox"> Sản phẩm nổi bật</label></div></div><div class="form-actions"><a class="button secondary" th:href="@{/admin/products}">Hủy</a><button class="button">Lưu sản phẩm</button></div></form></div></main></body></html>
