<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Quản lý sản phẩm')}"></head><body class="admin-page"><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container admin-layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><div class="admin-content"><div class="page-heading"><div><span class="eyebrow">DANH SÁCH HÀNG HÓA</span><h1>Quản lý sản phẩm</h1></div><a th:href="@{/admin/products/new}" class="button">+ Thêm sản phẩm</a></div><div class="admin-toolbar"><form th:action="@{/admin/products}" method="get"><input name="q" th:value="${q}" placeholder="Tìm tên hoặc thương hiệu..." aria-label="Tìm sản phẩm"><button class="button secondary">Tìm kiếm</button></form><span class="muted" th:text="${catalog.total}+' sản phẩm'"></span></div><div class="admin-table"><table><thead><tr><th>Sản phẩm</th><th>Giá bán</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p:${catalog.products}"><td><div class="table-product"><img th:src="@{${p.imageUrl}}" th:alt="${p.name}"><div><strong th:text="${p.name}"></strong><small th:text="${p.categoryName}"></small></div></div></td><td th:text="${@ui.money(p.price)}"></td><td><strong th:text="${p.stock}"></strong></td><td><span class="badge" th:classappend="${p.active}?'COMPLETED':'CANCELLED'" th:text="${p.active}?'Đang bán':'Đã ẩn'"></span></td><td><div class="row-actions"><a class="text-link" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Sửa</a><form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" data-confirm="Xóa sản phẩm này khỏi cửa hàng? Sản phẩm đã có đơn hàng sẽ được lưu ẩn để giữ lịch sử."><button>Xóa</button></form></div></td></tr><tr th:if="${catalog.products.isEmpty()}"><td colspan="5">Không có sản phẩm phù hợp.</td></tr></tbody></table></div><nav class="pagination" th:if="${catalog.pages>1}"><a th:each="i:${#numbers.sequence(1,catalog.pages)}" th:href="@{/admin/products(q=${q},page=${i})}" th:text="${i}" th:classappend="${catalog.page==i}?'selected'"></a></nav></div></main></body></html>
