<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Quản lý đơn hàng')}"></head><body class="admin-page"><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container admin-layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><div class="admin-content"><div class="page-heading"><div><span class="eyebrow">XỬ LÝ &amp; THEO DÕI</span><h1>Quản lý đơn hàng</h1></div><a th:href="@{/admin/export}" class="button secondary">↓ Xuất CSV</a></div><div class="admin-toolbar"><form th:action="@{/admin/orders}" method="get"><select name="status" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option><option value="PENDING" th:selected="${selectedStatus=='PENDING'}">Chờ xác nhận</option><option value="CONFIRMED" th:selected="${selectedStatus=='CONFIRMED'}">Đã xác nhận</option><option value="SHIPPING" th:selected="${selectedStatus=='SHIPPING'}">Đang giao hàng</option><option value="COMPLETED" th:selected="${selectedStatus=='COMPLETED'}">Hoàn thành</option><option value="CANCELLED" th:selected="${selectedStatus=='CANCELLED'}">Đã hủy</option></select><button class="button secondary">Lọc</button></form><span class="muted" th:text="${orders.size()}+' đơn hàng'"></span></div><div class="admin-table"><table><thead><tr><th>Mã đơn</th><th>Người nhận</th><th>Tổng tiền</th><th>Ngày đặt</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td><strong th:text="${o.code()}"></strong></td><td th:text="${o.recipient}"></td><td th:text="${@ui.money(o.total)}"></td><td th:text="${@ui.date(o.createdAt)}"></td><td><span class="badge" th:classappend="${o.status}" th:text="${o.statusName()}"></span></td><td><a th:href="@{/orders/{id}(id=${o.id})}" class="text-link">Chi tiết →</a></td></tr><tr th:if="${orders.isEmpty()}"><td colspan="6">Chưa có đơn hàng phù hợp.</td></tr></tbody></table></div></div></main></body></html>
