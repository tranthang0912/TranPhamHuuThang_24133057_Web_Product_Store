<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head(${product.name})}"></head><body><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container page-main"><div class="breadcrumb"><a th:href="@{/}">Trang chủ</a><span>/</span><a th:href="@{/products(category=${product.categoryId})}" th:text="${product.categoryName}"></a><span>/</span><span th:text="${product.name}"></span></div><section class="product-detail"><div class="detail-image"><span class="discount" th:if="${product.discount()>0}" th:text="'-'+${product.discount()}+'%'"></span><img th:src="@{${product.imageUrl}}" th:alt="${product.name}" width="500" height="500"></div><div class="detail-info"><span class="eyebrow" th:text="${product.categoryName}"></span><h1 th:text="${product.name}"></h1><p class="muted">Mã sản phẩm: <strong th:text="${product.sku}"></strong></p><p class="muted">Thương hiệu: <strong th:text="${product.brand}"></strong><span class="divider">|</span><span th:text="'Đã đặt '+${product.sold}"></span></p><div class="detail-price"><strong th:text="${@ui.money(product.price)}"></strong><del th:if="${product.discount()>0}" th:text="${@ui.money(product.originalPrice)}"></del></div><p class="stock-label" th:text="${product.stock>0}?'● Còn '+${product.stock}+' sản phẩm':'Tạm hết hàng'"></p><p class="price-source" th:if="${!#strings.isEmpty(product.sourceUrl)}">Tham khảo tại <a th:href="${product.sourceUrl}" th:text="${product.sourceRetailer}" target="_blank" rel="noopener noreferrer"></a><span th:if="${product.priceCheckedAt!=null}" th:text="' · Kiểm tra '+${#temporals.format(product.priceCheckedAt,'dd/MM/yyyy')}"></span></p><p class="product-description" th:text="${product.description}"></p><form th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><label for="quantity">Số lượng</label><div class="buy-row"><div class="quantity-control"><button type="button" data-step="-1" aria-label="Giảm số lượng">−</button><input id="quantity" type="number" name="quantity" value="1" min="1" th:max="${T(java.lang.Math).min(99,product.stock)}" required><button type="button" data-step="1" aria-label="Tăng số lượng">+</button></div><button class="button" th:disabled="${product.stock==0}">Thêm vào giỏ hàng →</button></div></form><form th:action="@{/wishlist/toggle}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><button class="text-button wishlist-detail" th:text="${wishlistIds.contains(product.id)}?'♥ Đã lưu vào yêu thích':'♡ Lưu vào yêu thích'"></button></form><div class="detail-delivery"><strong>Giao hàng &amp; thanh toán</strong><p>Phí giao hàng 30.000 ₫. Miễn phí cho đơn từ 500.000 ₫.</p><p>Thanh toán tiền mặt khi nhận hàng (COD).</p></div></div></section><section class="mt-large" th:if="${!related.isEmpty()}"><div class="section-heading"><h2>Có thể bạn cũng thích</h2><a class="text-link" th:href="@{/products(category=${product.categoryId})}">Xem cùng danh mục →</a></div><div class="product-grid"><th:block th:each="p:${related}"><article th:replace="~{fragments/common :: productCard(${p})}"></article></th:block></div></section></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
