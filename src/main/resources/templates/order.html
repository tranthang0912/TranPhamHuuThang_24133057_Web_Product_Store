<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Đơn hàng '+${order.code()})}"></head><body><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container page-main"><div class="breadcrumb"><a th:href="${currentUser.role=='ADMIN'}?@{/admin/orders}:@{/orders}">Đơn hàng</a><span>/</span><span th:text="${order.code()}"></span></div><div class="page-heading"><div><span class="eyebrow" th:text="'ĐẶT LÚC '+${@ui.date(order.createdAt)}"></span><h1 th:text="'Đơn hàng #'+${order.code()}"></h1></div><span class="badge" th:classappend="${order.status}" th:text="${order.statusName()}"></span></div><div class="panel"><div class="order-meta"><div><strong>Người nhận</strong><p th:text="${order.recipient}"></p><p th:text="${order.phone}"></p></div><div><strong>Địa chỉ giao hàng</strong><p th:text="${order.address}"></p><p th:if="${!#strings.isEmpty(order.note)}" th:text="'Ghi chú: '+${order.note}"></p></div><div><strong>Thanh toán khi nhận hàng</strong><p>Phương thức: COD</p><p th:text="${order.status=='COMPLETED'}?'Đơn hàng đã hoàn thành.':'Thanh toán cho người giao hàng.'"></p></div></div><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="item:${items}"><td><div class="table-product"><img th:src="@{${item.imageUrl}}" th:alt="${item.productName}"><strong th:text="${item.productName}"></strong></div></td><td th:text="${@ui.money(item.unitPrice)}"></td><td th:text="${item.quantity}"></td><td><strong th:text="${@ui.money(item.total())}"></strong></td></tr></tbody></table></div><div class="mt"><div class="summary-row"><span>Tạm tính</span><strong th:text="${@ui.money(order.subtotal)}"></strong></div><div class="summary-row"><span>Phí vận chuyển</span><strong th:text="${@ui.money(order.shippingFee)}"></strong></div><div class="summary-row total"><span>Tổng thanh toán</span><strong th:text="${@ui.money(order.total)}"></strong></div></div></div><div class="order-actions"><form th:if="${order.status=='PENDING' and currentUser.id==order.userId}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" data-confirm="Bạn muốn hủy đơn hàng này?"><button class="button danger-button">Hủy đơn hàng</button></form><form th:if="${currentUser.role=='ADMIN' and order.status!='COMPLETED' and order.status!='CANCELLED'}" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><label for="status">Cập nhật trạng thái</label><select name="status" id="status"><option th:if="${order.status=='PENDING'}" value="CONFIRMED">Xác nhận đơn</option><option th:if="${order.status=='CONFIRMED'}" value="SHIPPING">Bắt đầu giao hàng</option><option th:if="${order.status=='SHIPPING'}" value="COMPLETED">Đã giao thành công</option><option th:if="${order.status=='PENDING' or order.status=='CONFIRMED'}" value="CANCELLED">Hủy đơn và hoàn tồn kho</option></select><button class="button">Cập nhật</button></form></div></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
