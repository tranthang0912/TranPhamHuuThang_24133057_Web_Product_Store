<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Sản phẩm yêu thích')}"></head><body><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container page-main"><div class="page-heading"><div><span class="eyebrow">DÀNH RIÊNG CHO BẠN</span><h1>Những món bạn thích<span class="orange-dot">.</span></h1></div><span class="muted" th:text="${products.size()}+' sản phẩm'"></span></div><div th:if="${products.isEmpty()}" class="empty-state"><span>♡</span><h2>Lưu lại điều bạn thích</h2><p>Nhấn biểu tượng trái tim trên sản phẩm để lưu vào đây.</p><a class="button" th:href="@{/products}">Khám phá sản phẩm</a></div><div class="product-grid"><th:block th:each="p:${products}"><article th:replace="~{fragments/common :: productCard(${p})}"></article></th:block></div></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
