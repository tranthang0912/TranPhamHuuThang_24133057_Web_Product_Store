<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Đặt hàng')}"></head><body><div th:replace="~{fragments/common :: header}"></div><main id="main" class="container page-main"><div class="breadcrumb"><a th:href="@{/cart}">Giỏ hàng</a><span>/</span><span>Đặt hàng</span></div><div class="page-heading"><h1>Chỉ còn một bước nữa.</h1></div><form class="two-columns" th:action="@{/checkout}" method="post" th:object="${form}" data-submit-once><div class="panel"><h2>Thông tin giao hàng</h2><div class="alert danger" th:if="${#fields.hasAnyErrors()}" role="alert"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{token}"><div class="form-grid"><div><label for="recipient">Họ tên người nhận</label><input id="recipient" th:field="*{recipient}" autocomplete="name" maxlength="100" required></div><div><label for="phone">Số điện thoại</label><input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" pattern="0[0-9]{9}" placeholder="0901234567" required></div><div class="span-two"><label for="address">Địa chỉ nhận hàng</label><textarea id="address" th:field="*{address}" autocomplete="street-address" minlength="10" maxlength="500" placeholder="Số nhà, tên đường, phường/xã, tỉnh/thành phố" required></textarea></div><div class="span-two"><label for="note">Ghi chú cho đơn hàng <span class="muted">(không bắt buộc)</span></label><textarea id="note" th:field="*{note}" maxlength="1000" placeholder="Lưu ý thêm về địa điểm giao hàng..."></textarea></div></div><h3 class="mt">Phương thức thanh toán</h3><div class="payment-option"><span>◉</span><p><strong>Thanh toán khi nhận hàng (COD)</strong><small>Thanh toán cho người giao hàng khi nhận sản phẩm.</small></p></div></div><aside class="panel summary"><h2>Đơn hàng của bạn</h2><div class="checkout-item" th:each="item:${cart.items}"><img th:src="@{${item.product.imageUrl}}" th:alt="${item.product.name}"><div><span th:text="${item.product.name}"></span><small th:text="'Số lượng: '+${item.quantity}"></small></div><strong th:text="${@ui.money(item.total())}"></strong></div><div class="summary-row"><span>Tạm tính</span><strong th:text="${@ui.money(cart.subtotal)}"></strong></div><div class="summary-row"><span>Phí vận chuyển</span><strong th:text="${cart.shipping.signum()==0}?'Miễn phí':${@ui.money(cart.shipping)}"></strong></div><div class="summary-row total"><span>Tổng cộng</span><strong th:text="${@ui.money(cart.total)}"></strong></div><button type="submit" class="button full" th:disabled="${cart.items.isEmpty()}">Xác nhận đặt hàng →</button><p class="hint">Kiểm tra thông tin giao hàng trước khi xác nhận.</p></aside></form></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
