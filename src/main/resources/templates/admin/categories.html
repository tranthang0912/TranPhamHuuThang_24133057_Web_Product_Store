<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Quản lý danh mục')}"></head><body class="admin-page"><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container admin-layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><div class="admin-content"><div class="page-heading"><div><span class="eyebrow">SẮP XẾP CỬA HÀNG</span><h1>Danh mục hàng hóa</h1></div></div><div class="category-manage"><section class="panel"><h2>Danh mục hiện có</h2><div class="category-edit" th:each="c:${categories}"><form class="edit" th:action="@{/admin/categories/save}" method="post"><input type="hidden" name="id" th:value="${c.id}"><div><label th:for="'name-'+${c.id}">Tên danh mục</label><input th:id="'name-'+${c.id}" name="name" th:value="${c.name}" maxlength="80" required></div><div><label th:for="'slug-'+${c.id}">Mã danh mục</label><input th:id="'slug-'+${c.id}" name="slug" th:value="${c.slug}" pattern="[a-z0-9-]{1,80}" required></div><button class="button small secondary">Lưu</button></form><div class="category-edit-footer"><a th:href="@{/products(category=${c.id})}" th:text="${c.productCount}+' sản phẩm · '+${c.stock}+' tồn kho →'"></a><form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" data-confirm="Xóa danh mục này? Chỉ xóa được danh mục không còn sản phẩm."><button class="remove-button">Xóa danh mục</button></form></div></div></section><section class="panel"><h2>Thêm danh mục</h2><form th:action="@{/admin/categories/save}" method="post"><label for="newName">Tên danh mục</label><input id="newName" name="name" maxlength="80" placeholder="Ví dụ: Sách & văn phòng" required><label for="newSlug">Mã danh mục</label><input id="newSlug" name="slug" pattern="[a-z0-9-]{1,80}" placeholder="sach-van-phong" required><p class="hint">Chữ thường không dấu, số và dấu gạch ngang.</p><button class="button full mt">+ Thêm danh mục</button></form></section></div></div></main></body></html>
