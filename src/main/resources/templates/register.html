<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Tạo tài khoản')}"></head><body><div th:replace="~{fragments/common :: header}"></div><main id="main" class="auth-page"><div class="auth-shell"><div class="auth-story"><span class="eyebrow">GIA NHẬP PRODUCT STORE</span><h2>Một tài khoản.<br>Nhiều điều<br>để khám phá.</h2><p>Lưu sản phẩm yêu thích, đặt hàng và theo dõi mọi đơn mua trong cùng một nơi.</p><img th:src="@{/images/auth-tech.jpg}" alt="Thiết bị công nghệ"></div><div class="auth-form"><h1>Tạo tài khoản</h1><p>Bắt đầu mua sắm chỉ trong một phút.</p><form th:action="@{/register}" method="post" th:object="${form}"><div class="alert danger" th:if="${#fields.hasAnyErrors()}" role="alert"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><label for="fullName">Họ và tên</label><input id="fullName" th:field="*{fullName}" autocomplete="name" maxlength="100" placeholder="Nguyễn Văn An" required><label for="email">Địa chỉ email</label><input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="254" placeholder="ban@example.com" required><label for="password">Mật khẩu</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="64" required><button type="button" class="password-toggle" aria-label="Hiện mật khẩu">Hiện</button></div><p class="hint">Từ 8 ký tự, bao gồm chữ và số.</p><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="64" required><button class="button full" type="submit">Tạo tài khoản →</button></form><div class="auth-switch">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></div></div></div></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
