<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head(${title})}"></head><body><div th:replace="~{fragments/common :: header}"></div><main id="main" class="container page-main"><div class="breadcrumb"><a th:href="@{/}">Trang chủ</a><span>/</span><span>Sản phẩm</span></div><div class="page-heading"><div><span class="eyebrow">TÌM MÓN ĐỒ TIẾP THEO CỦA BẠN</span><h1 th:text="${title}"></h1></div><span class="muted" th:text="${catalog.total}+' sản phẩm'"></span></div>
<div class="catalog-layout"><aside class="filters"><form th:action="@{/products}" method="get"><input type="hidden" name="q" th:value="${q}"><h3>Bộ lọc sản phẩm</h3><label for="category">Danh mục</label><select id="category" name="category"><option value="">Tất cả danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}+' ('+${c.productCount}+')'" th:selected="${selectedCategory==c.id}"></option></select><label for="max-price">Mức giá tối đa</label><select id="max-price" name="maxPrice"><option value="">Tất cả mức giá</option><option th:each="price:${priceOptions}" th:value="${price}" th:text="${@ui.money(price)}" th:selected="${maxPrice!=null and maxPrice.intValue()==price}"></option></select><label for="sort">Sắp xếp theo</label><select id="sort" name="sort"><option value="featured" th:selected="${sort=='featured'}">Nổi bật</option><option value="newest" th:selected="${sort=='newest'}">Mới nhất</option><option value="popular" th:selected="${sort=='popular'}">Bán chạy</option><option value="price-asc" th:selected="${sort=='price-asc'}">Giá tăng dần</option><option value="price-desc" th:selected="${sort=='price-desc'}">Giá giảm dần</option></select><label class="check"><input type="checkbox" name="deals" value="true" th:checked="${deals}"> Đang có ưu đãi</label><label class="check"><input type="checkbox" name="inStock" value="true" th:checked="${inStock}"> Chỉ hiện còn hàng</label><button class="button full">Áp dụng bộ lọc</button><a th:href="@{/products}" class="reset-link">Xóa bộ lọc</a></form></aside>
<div class="catalog-content"><div class="catalog-toolbar"><p th:if="${!#strings.isEmpty(q)}">Kết quả cho <strong th:text="'“'+${q}+'”'"></strong></p><p th:unless="${!#strings.isEmpty(q)}">Một chút cảm hứng cho mỗi ngày.</p><span th:text="'Trang '+${catalog.page}+' / '+${catalog.pages}"></span></div><div class="product-grid catalog-products"><th:block th:each="p:${catalog.products}"><article th:replace="~{fragments/common :: productCard(${p})}"></article></th:block></div><div th:if="${catalog.total==0}" class="empty-state"><span>⌕</span><h2>Chưa tìm thấy sản phẩm</h2><p>Thử từ khóa khác hoặc bỏ bớt bộ lọc.</p><a th:href="@{/products}" class="button secondary">Xem tất cả sản phẩm</a></div><nav th:if="${catalog.pages>1}" class="pagination" aria-label="Phân trang"><a th:each="i:${#numbers.sequence(1,catalog.pages)}" th:href="@{/products(q=${q},category=${selectedCategory},sort=${sort},page=${i},deals=${deals},inStock=${inStock},maxPrice=${maxPrice})}" th:text="${i}" th:classappend="${catalog.page==i}?'selected'" th:aria-current="${catalog.page==i}?'page':null"></a></nav></div></div>
</main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
