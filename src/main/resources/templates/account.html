<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Tài khoản của bạn')}"></head><body><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container page-main"><div class="page-heading"><div><span class="eyebrow">KHÔNG GIAN CỦA BẠN</span><h1>Tài khoản của tôi</h1></div><form th:action="@{/logout}" method="post"><button class="button secondary">Đăng xuất</button></form></div><div class="account-layout"><section class="panel"><div class="account-top"><h2>Thông tin cá nhân</h2><span class="badge" th:text="${currentUser.role=='ADMIN'}?'Quản trị viên':'Khách hàng'"></span></div><p class="muted" th:text="${currentUser.email}"></p><form th:action="@{/account}" method="post"><label for="fullName">Họ và tên</label><input id="fullName" name="fullName" th:value="${currentUser.fullName}" maxlength="100" autocomplete="name" required><label for="phone">Số điện thoại</label><input id="phone" name="phone" th:value="${currentUser.phone}" type="tel" pattern="0[0-9]{9}" autocomplete="tel"><label for="address">Địa chỉ mặc định</label><textarea id="address" name="address" th:text="${currentUser.address}" maxlength="500" autocomplete="street-address"></textarea><button class="button">Lưu thay đổi</button></form></section><section class="panel"><h2>Đổi mật khẩu</h2><p class="muted">Bảo vệ tài khoản của bạn.</p><form th:action="@{/account/password}" method="post"><label for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="64" required><label for="newPassword">Mật khẩu mới</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="64" required><p class="hint">Từ 8 ký tự, bao gồm chữ và số.</p><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="64" required><button class="button secondary">Cập nhật mật khẩu</button></form></section></div><div class="order-actions"><a th:href="@{/orders}" class="text-link">Đơn hàng của tôi →</a><a th:href="@{/wishlist}" class="text-link">Sản phẩm yêu thích →</a><a th:if="${currentUser.role=='ADMIN'}" th:href="@{/admin}" class="text-link">Trang quản trị →</a></div></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
