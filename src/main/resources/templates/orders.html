<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Đơn hàng của tôi')}"></head><body><div th:replace="~{fragments/common :: header}"></div><div th:replace="~{fragments/common :: flash}"></div><main id="main" class="container page-main"><div class="page-heading"><div><span class="eyebrow">THEO DÕI HÀNH TRÌNH MUA SẮM</span><h1>Đơn hàng của tôi</h1></div><a th:href="@{/products}" class="text-link">Tiếp tục mua sắm →</a></div><div class="empty-state" th:if="${orders.isEmpty()}"><span>▤</span><h2>Bạn chưa có đơn hàng nào</h2><p>Đơn hàng sau khi đặt sẽ xuất hiện tại đây.</p><a th:href="@{/products}" class="button">Khám phá cửa hàng</a></div><div class="order-cards"><article class="order-card" th:each="o:${orders}"><div><h3 th:text="'Đơn hàng #'+${o.code()}"></h3><p th:text="${@ui.date(o.createdAt)}"></p><p th:text="'Người nhận: '+${o.recipient}"></p></div><div class="order-card-right"><span class="badge" th:classappend="${o.status}" th:text="${o.statusName()}"></span><strong th:text="${@ui.money(o.total)}"></strong><a th:href="@{/orders/{id}(id=${o.id})}">Xem chi tiết →</a></div></article></div></main><footer th:replace="~{fragments/common :: footer}"></footer></body></html>
