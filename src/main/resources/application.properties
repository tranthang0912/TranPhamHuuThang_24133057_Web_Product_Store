spring.application.name=product-store
spring.config.import=optional:file:E:/Cong_Nghe_Phan_Mem/Chuong_Trinh_Product_Store/.local/application.properties,optional:file:.local/application.properties
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Fixed SQL credentials are saved once in .local/application.properties.
# Website, Java connection test and product importer use that same file.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
store.admin.email=${STORE_ADMIN_EMAIL:admin}
store.admin.password=${STORE_ADMIN_PASSWORD:admin}
